project_id = "firstrate-hq-local"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
shadow_port = 54320
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
# The CLI maps this flag to email-provider availability. Global auth.enable_signup
# stays false, allowing admin-created users to log in without self-service signup.
enable_signup = true
enable_confirmations = true

[functions.job-materials]
enabled = true
verify_jwt = true
entrypoint = "./functions/job-materials/index.ts"
